version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    container_name: db
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file: .env

  backend:
    image: liectaski/kittygram_backend
    container_name: backend
    restart: always
    env_file: .env
    volumes:
      - static:/app/static/
      - media:/app/media/

  gateway:
    image: liectaski/kittygram_gateway
    container_name: gateway
    restart: always
    env_file: .env
    ports:
      - 9000:80
    volumes:
      - static:/static
      - media:/app/media/
